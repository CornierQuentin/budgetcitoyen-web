name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (E2E)
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      # .env n'est jamais committe (secrets/config locale) : sans cette
      # variable, le build embarquerait une baseURL axios vide et les
      # appels /api/v1/** interceptes par e2e/helpers/mockApi.ts ne
      # correspondraient jamais, laissant l'app sans donnees. Meme valeur
      # que .env.example (arbitraire ici, purement mockee).
      VITE_API_BASE_URL: http://localhost:8001/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test E2E
        run: npm run test:e2e
