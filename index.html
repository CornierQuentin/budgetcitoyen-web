  <body>
    <!--
      CONTRAT DE DIRECTION — refonte graphique 2026 (clé de tirage : d6f7aefe, résolution : canon)

      THESIS : le budget de l'État présenté avec le niveau de finition d'un outil
      professionnel (Stripe Dashboard, Google Analytics), choix explicite de l'auteur
      contre les directions alternatives proposées. Refuse l'austérité générique
      antérieure : cartes grises de poids égal, sans hiérarchie ni personnalité.

      OWN-WORLD : coque applicative. Fond froid, surfaces blanches, filet 1px, encre
      biaisée bleu, un seul accent d'action. Aucun montant n'est codé par une teinte
      connotée politiquement (contrainte de neutralité) : les missions partagent une
      barre unique, les recettes une rampe de valeurs d'une seule teinte. Le rouge et
      le vert sémantiques sont réservés aux écarts, jamais aux montants absolus.

      STORY : le visiteur comprend en trois chiffres où en est le budget, puis descend
      au détail par mission s'il le veut. Chaque montant reste relié à sa source officielle.

      FIRST VIEWPORT : rail latéral groupé par intention, barre supérieure avec sélecteur
      d'année, trois chiffres clés avec leur écart vs année précédente, puis le tableau
      dense des missions à gauche et l'anneau des recettes à droite.

      FORM : le standard de la catégorie, joué franchement — porte de sortie permanente
      prise par l'utilisateur, exécutée à pleine fidélité, sans ironie.

      FINISH : unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
